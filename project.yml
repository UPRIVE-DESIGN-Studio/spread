name: Spread
options:
  bundleIdPrefix: design.uprive
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: AWK5ZJPJG6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Spread:
    type: application
    platform: macOS
    sources:
      - Spread
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Spread/Info.plist
      properties:
        CFBundleDisplayName: Spread
        CFBundleName: Spread
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.uprive.spread
        PRODUCT_NAME: Spread
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  SpreadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpreadTests
    dependencies:
      - target: Spread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.uprive.spread.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spread.app/Contents/MacOS/Spread"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Spread:
    build:
      targets:
        Spread: all
        SpreadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpreadTests
    archive:
      config: Release
